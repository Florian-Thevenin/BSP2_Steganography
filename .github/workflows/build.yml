name: Build Stag Hide

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name "Stag Hide" --icon ".docs/Stag.ico" --add-data ".docs;.docs" gui.py

      - name: Build Linux/macOS
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name "Stag Hide" --add-data ".docs:.docs" gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: StagHide-${{ matrix.os }}
          path: dist/*